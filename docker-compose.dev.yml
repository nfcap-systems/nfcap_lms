services:
  nfcap-lms-dev:
    # No fixed container_name: a zero-downtime deploy (.github/workflows/deploy-staging.yml) runs
    # this same service under two alternating Compose project names ("blue"/"green") so the new
    # version's container can start and pass its health check *before* the old one is torn down.
    # A fixed name would collide between the two.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        SENTRY_ORG: ${SENTRY_ORG}
        SENTRY_PROJECT: ${SENTRY_PROJECT}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    env_file:
      - .env
    networks:
      - hosting
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=hosting'
      - 'traefik.http.routers.nfcap-lms-dev.rule=Host(`dev-nfcap.corecloud365.com`)'
      - 'traefik.http.routers.nfcap-lms-dev.entrypoints=websecure'
      - 'traefik.http.routers.nfcap-lms-dev.tls=true'
      - 'traefik.http.routers.nfcap-lms-dev.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.nfcap-lms-dev-http.rule=Host(`dev-nfcap.corecloud365.com`)'
      - 'traefik.http.routers.nfcap-lms-dev-http.entrypoints=web'
      - 'traefik.http.routers.nfcap-lms-dev-http.middlewares=nfcap-lms-dev-redirect'
      - 'traefik.http.middlewares.nfcap-lms-dev-redirect.redirectscheme.scheme=https'
      - 'traefik.http.services.nfcap-lms-dev.loadbalancer.server.port=3000'
      # Traefik probes each backend itself and only routes to ones passing this check — the
      # piece that makes the blue/green swap below safe. Without it, Traefik would route to the
      # new container as soon as it starts, not once it's actually ready to serve.
      - 'traefik.http.services.nfcap-lms-dev.loadbalancer.healthcheck.path=/login'
      - 'traefik.http.services.nfcap-lms-dev.loadbalancer.healthcheck.interval=5s'
      - 'traefik.http.services.nfcap-lms-dev.loadbalancer.healthcheck.timeout=3s'

networks:
  hosting:
    external: true
