name: Data Retention Sweep

on:
  # Schedule disabled 2026-11-22: no production environment/secrets (APP_URL, CRON_SECRET) exist
  # yet, so this ran daily against nothing and failed every time since 2026-11-17. Re-enable the
  # schedule block below once production exists and those secrets are set.
  # schedule:
  #   - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  sweep:
    name: Run retention sweep
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Call retention endpoint
        run: |
          curl --fail-with-body -sS -X POST "${APP_URL}/api/cron/data-retention" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
