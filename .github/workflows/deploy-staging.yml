name: Deploy to Staging

on:
  push:
    branches: [stage]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  checks:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: checks
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DIR="/home/websites/nfcap_lms"

            # First-push bootstrap: create directory and clone if missing
            if [ ! -d "$DIR" ]; then
              echo "First deployment — bootstrapping $DIR"
              mkdir -p "$DIR"
              git clone -b stage https://github.com/${{ github.repository }}.git "$DIR"
            fi

            cd "$DIR"
            git fetch origin
            git checkout stage
            git pull origin stage

            # Write build-time + runtime secrets to .env (overwritten each deploy). docker compose
            # reads this same file for both its own build-arg substitution (docker-compose.dev.yml's
            # `args:`) and the container's runtime env (`env_file:`) — one file, both purposes.
            cat > .env << ENVEOF
            DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
            DIRECT_URL=${{ secrets.STAGING_DIRECT_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
            SENTRY_DSN=${{ secrets.STAGING_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.STAGING_SENTRY_DSN }}
            SENTRY_ORG=${{ secrets.STAGING_SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.STAGING_SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.STAGING_SENTRY_AUTH_TOKEN }}
            ENVEOF

            # Zero-downtime swap: Traefik already fronts this service (docker-compose.dev.yml's
            # labels) and merges every container sharing those labels into one backend pool, so
            # running the same compose file under a second project name starts a second,
            # independent container that Traefik picks up automatically — without touching the
            # container currently live. Once the new one passes its health check, the old one is
            # torn down; until then, the old one keeps serving all traffic untouched. State (which
            # color is live) persists in .deploy-color between deploys.
            COLOR_FILE="$DIR/.deploy-color"
            CURRENT=$(cat "$COLOR_FILE" 2>/dev/null || echo "none")
            if [ "$CURRENT" = "blue" ]; then NEW="green"; else NEW="blue"; fi
            echo "Current live color: $CURRENT — deploying $NEW"

            docker compose -p "nfcap-lms-$NEW" -f docker-compose.dev.yml up -d --build

            CONTAINER=$(docker compose -p "nfcap-lms-$NEW" -f docker-compose.dev.yml ps -q nfcap-lms-dev)
            echo "Waiting for $NEW ($CONTAINER) to be healthy..."
            sleep 10
            HEALTHY=0
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "$NEW is healthy!"
                HEALTHY=1
                break
              fi
              echo "Attempt $i/12: Status is $STATUS, waiting..."
              sleep 10
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "$NEW did not become healthy within 2 minutes — rolling back, $CURRENT stays live"
              docker logs "$CONTAINER" --tail 50
              docker compose -p "nfcap-lms-$NEW" -f docker-compose.dev.yml down
              exit 1
            fi

            if [ "$CURRENT" != "none" ]; then
              echo "Tearing down previous color ($CURRENT)"
              docker compose -p "nfcap-lms-$CURRENT" -f docker-compose.dev.yml down
            fi
            echo "$NEW" > "$COLOR_FILE"

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.STAGING_DOMAIN }}")
          case "$HTTP_CODE" in
            200)
              echo "Staging health check passed (HTTP $HTTP_CODE)"
              ;;
            307|308)
              LOCATION=$(curl -sI "https://${{ vars.STAGING_DOMAIN }}" | grep -i '^location:' | tr -d '\r')
              echo "Redirect: $LOCATION"
              if echo "$LOCATION" | grep -qi '/login'; then
                echo "Staging health check passed (HTTP $HTTP_CODE, redirects to login as expected)"
              else
                echo "Staging health check failed (HTTP $HTTP_CODE, unexpected redirect target)"
                exit 1
              fi
              ;;
            *)
              echo "Staging health check failed (HTTP $HTTP_CODE)"
              exit 1
              ;;
          esac
