name: Deploy to Staging

on:
  push:
    branches: [stage]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  checks:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: checks
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DIR="/home/websites/nfcap_lms"

            # First-push bootstrap: create directory and clone if missing
            if [ ! -d "$DIR" ]; then
              echo "First deployment — bootstrapping $DIR"
              mkdir -p "$DIR"
              git clone -b stage https://github.com/${{ github.repository }}.git "$DIR"
            fi

            cd "$DIR"
            git fetch origin
            git checkout stage
            git pull origin stage

            # Write build-time + runtime secrets to .env (overwritten each deploy)
            cat > .env << ENVEOF
            DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
            DIRECT_URL=${{ secrets.STAGING_DIRECT_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
            ENVEOF

            docker compose -f docker-compose.dev.yml up -d --build

            echo "Waiting for container to be healthy..."
            sleep 10
            CONTAINER="nfcap-lms-dev"
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                exit 0
              fi
              echo "Attempt $i/12: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Container did not become healthy within 2 minutes"
            docker logs "$CONTAINER" --tail 50
            exit 1

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.STAGING_DOMAIN }}")
          case "$HTTP_CODE" in
            200)
              echo "Staging health check passed (HTTP $HTTP_CODE)"
              ;;
            307|308)
              LOCATION=$(curl -sI "https://${{ vars.STAGING_DOMAIN }}" | grep -i '^location:' | tr -d '\r')
              echo "Redirect: $LOCATION"
              if echo "$LOCATION" | grep -qi '/login'; then
                echo "Staging health check passed (HTTP $HTTP_CODE, redirects to login as expected)"
              else
                echo "Staging health check failed (HTTP $HTTP_CODE, unexpected redirect target)"
                exit 1
              fi
              ;;
            *)
              echo "Staging health check failed (HTTP $HTTP_CODE)"
              exit 1
              ;;
          esac
