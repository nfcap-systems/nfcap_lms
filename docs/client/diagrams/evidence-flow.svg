<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="424" viewBox="0 0 1040 424" font-family="'Segoe UI', Arial, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#222" stroke-width="2.2"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<rect x="20" y="40" width="1000" height="112" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" />
<text x="60" y="61" font-size="11.5" font-weight="700" text-anchor="start" fill="#666">TRAINEE</text>
<rect x="20" y="172" width="1000" height="112" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" />
<text x="60" y="193" font-size="11.5" font-weight="700" text-anchor="start" fill="#666">ADMIN REVIEW</text>
<rect x="20" y="304" width="1000" height="112" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" />
<text x="60" y="325" font-size="11.5" font-weight="700" text-anchor="start" fill="#666">RESULT</text>
<rect x="60" y="68" width="250" height="66" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"/>
<text x="185" y="89" font-size="13" font-weight="600" text-anchor="middle" fill="#222">1 · Sees the checklist</text>
<text x="185" y="105" font-size="11" font-weight="400" text-anchor="middle" fill="#666">What to photograph,</text>
<text x="185" y="121" font-size="11" font-weight="400" text-anchor="middle" fill="#666">criterion by criterion</text>
<rect x="390" y="68" width="250" height="66" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"/>
<text x="515" y="89" font-size="13" font-weight="600" text-anchor="middle" fill="#222">2 · Captures photo / video</text>
<text x="515" y="105" font-size="11" font-weight="400" text-anchor="middle" fill="#666">One per criterion</text>
<text x="515" y="121" font-size="11" font-weight="400" text-anchor="middle" fill="#666">From a phone or laptop browser</text>
<rect x="720" y="68" width="250" height="66" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"/>
<text x="845" y="89" font-size="13" font-weight="600" text-anchor="middle" fill="#222">3 · Submits</text>
<text x="845" y="105" font-size="11" font-weight="400" text-anchor="middle" fill="#666">Blocked until every</text>
<text x="845" y="121" font-size="11" font-weight="400" text-anchor="middle" fill="#666">required item is captured</text>
<polyline points="310,101 390,101" fill="none" stroke="#222" stroke-width="1.5" stroke-linejoin="round"  marker-end="url(#ah)"/>
<polyline points="640,101 720,101" fill="none" stroke="#222" stroke-width="1.5" stroke-linejoin="round"  marker-end="url(#ah)"/>
<rect x="720" y="200" width="250" height="66" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"/>
<text x="845" y="229" font-size="13" font-weight="600" text-anchor="middle" fill="#222">4 · Review queue</text>
<text x="845" y="245" font-size="11" font-weight="400" text-anchor="middle" fill="#666">Oldest waiting first</text>
<rect x="390" y="200" width="250" height="66" rx="5" fill="#fff" stroke="#222" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"/>
<text x="515" y="221" font-size="13" font-weight="600" text-anchor="middle" fill="#222">5 · Marks each criterion</text>
<text x="515" y="237" font-size="11" font-weight="400" text-anchor="middle" fill="#666">Met / Not Met</text>
<text x="515" y="253" font-size="11" font-weight="400" text-anchor="middle" fill="#666">+ notes pinned on the photo</text>
<polyline points="845,134 845,200" fill="none" stroke="#222" stroke-width="1.5" stroke-linejoin="round"  marker-end="url(#ah)"/>
<polyline points="720,233 640,233" fill="none" stroke="#222" stroke-width="1.5" stroke-linejoin="round"  marker-end="url(#ah)"/>
<polygon points="185,189 310,233 185,277 60,233" fill="#fff" stroke="#222" stroke-width="2.6" stroke-dasharray="1.5 4" stroke-linecap="round"/>
<text x="185" y="230" font-size="12.5" font-weight="600" text-anchor="middle" fill="#222">All required</text>
<text x="185" y="246" font-size="12.5" font-weight="600" text-anchor="middle" fill="#222">criteria Met?</text>
<polyline points="390,233 310,233" fill="none" stroke="#222" stroke-width="1.5" stroke-linejoin="round"  marker-end="url(#ah)"/>
<polyline points="185,277 185,332" fill="none" stroke="#222" stroke-width="1.5" stroke-linejoin="round"  marker-end="url(#ah)"/>
<rect x="192.7" y="304" width="28.6" height="17" fill="#fff"/>
<text x="207" y="316" font-size="11" font-weight="600" text-anchor="middle" fill="#222">Yes</text>
<rect x="60" y="332" width="250" height="62" rx="5" fill="#fff" stroke="#222" stroke-width="2.6" stroke-dasharray="1.5 4" stroke-linecap="round"/>
<text x="185" y="359" font-size="13" font-weight="600" text-anchor="middle" fill="#222">Certificate issued</text>
<text x="185" y="375" font-size="11" font-weight="400" text-anchor="middle" fill="#666">PDF + QR public verification (P4)</text>
<polyline points="60,233 34,233 34,26 515,26 515,68" fill="none" stroke="#222" stroke-width="1.5" stroke-linejoin="round"  marker-end="url(#ah)"/>
<rect x="40.8" y="203" width="22.4" height="17" fill="#fff"/>
<text x="52" y="215" font-size="11" font-weight="600" text-anchor="middle" fill="#222">No</text>
<text x="300" y="17" font-size="11.5" font-weight="600" text-anchor="start" fill="#222">No — trainee sees exactly what failed and why, re-shoots only those items, and resubmits</text>
<rect x="390" y="332" width="580" height="62" rx="5" fill="#f3f3f3" stroke="#222" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"/>
<text x="680" y="358" font-size="13" font-weight="700" text-anchor="middle" fill="#222">The rule that protects every credential</text>
<text x="680" y="378" font-size="11.5" font-weight="400" text-anchor="middle" fill="#666">A certificate cannot be issued unless every required criterion is Met.</text>
</svg>